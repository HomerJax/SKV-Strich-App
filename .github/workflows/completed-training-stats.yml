name: Completed-training statistics safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  stats-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regression checks (no database needed)
        run: node --test scripts/completed-session-statistics.test.mjs
      - name: Install for TypeScript, without updating lockfile
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
