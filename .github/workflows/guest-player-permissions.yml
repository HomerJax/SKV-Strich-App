name: Guest player permissions regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guest-permissions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify guest roles, server access and rating privacy
        run: npm run test:guest
