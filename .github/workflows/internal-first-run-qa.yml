name: Internal first-run QA safeguards

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  first-run-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: First-run safeguards
        run: node --test scripts/first-run-qa.test.mjs
      - name: Type check
        run: npx tsc --noEmit
