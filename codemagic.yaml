workflows:
  android-debug:
    name: strikr Android Test APK
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      groups:
        - firebase_android
      node: 22
      java: 21

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Restore Firebase Android config
        script: |
          node <<'NODE'
          const fs = require('fs');
          const raw = process.env.GOOGLE_SERVICES_JSON_BASE64;

          if (!raw) {
            console.error('GOOGLE_SERVICES_JSON_BASE64 is not set.');
            process.exit(1);
          }

          let json;
          try {
            json = Buffer.from(raw, 'base64').toString('utf8');
          } catch (error) {
            console.error('GOOGLE_SERVICES_JSON_BASE64 is not valid Base64.', error);
            process.exit(1);
          }

          let config;
          try {
            config = JSON.parse(json);
          } catch (error) {
            console.error('Decoded google-services.json is not valid JSON.', error);
            process.exit(1);
          }

          const clients = Array.isArray(config.client) ? config.client : [];
          const matchesPackage = clients.some(
            (client) =>
              client?.client_info?.android_client_info?.package_name ===
              'team.strikr.app',
          );

          if (!matchesPackage) {
            console.error('google-services.json does not contain team.strikr.app.');
            process.exit(1);
          }

          fs.mkdirSync('android/app', { recursive: true });
          fs.writeFileSync('android/app/google-services.json', json);
          console.log('Firebase Android config restored for team.strikr.app.');
          NODE

      - name: Sync Capacitor Android
        script: |
          npx cap sync android

      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk

  android-play-release:
    name: strikr Google Play AAB + APK
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      groups:
        - firebase_android
      android_signing:
        - strikr_upload
      node: 22
      java: 21

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Restore Firebase Android config
        script: |
          node <<'NODE'
          const fs = require('fs');
          const raw = process.env.GOOGLE_SERVICES_JSON_BASE64;

          if (!raw) {
            console.error('GOOGLE_SERVICES_JSON_BASE64 is not set.');
            process.exit(1);
          }

          let json;
          try {
            json = Buffer.from(raw, 'base64').toString('utf8');
          } catch (error) {
            console.error('GOOGLE_SERVICES_JSON_BASE64 is not valid Base64.', error);
            process.exit(1);
          }

          let config;
          try {
            config = JSON.parse(json);
          } catch (error) {
            console.error('Decoded google-services.json is not valid JSON.', error);
            process.exit(1);
          }

          const clients = Array.isArray(config.client) ? config.client : [];
          const matchesPackage = clients.some(
            (client) =>
              client?.client_info?.android_client_info?.package_name ===
              'team.strikr.app',
          );

          if (!matchesPackage) {
            console.error('google-services.json does not contain team.strikr.app.');
            process.exit(1);
          }

          fs.mkdirSync('android/app', { recursive: true });
          fs.writeFileSync('android/app/google-services.json', json);
          console.log('Firebase Android config restored for team.strikr.app.');
          NODE

      - name: Sync Capacitor Android
        script: |
          npx cap sync android

      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: Build signed Android App Bundle and APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease

    artifacts:
      - android/app/build/outputs/bundle/release/app-release.aab
      - android/app/build/outputs/apk/release/*.apk

  ios-testflight:
    name: strikr iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: Codemagic

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: team.strikr.app
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Apply signing profiles
        script: |
          xcode-project use-profiles

      - name: Set marketing version
        script: |
          cd ios/App
          agvtool new-marketing-version 1.1

      - name: Set build number
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
